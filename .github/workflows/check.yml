name: check data

# Runs the same validator contributors are asked to run, so a pull request
# that breaks the data shows a failing check instead of relying on the
# checkbox in the template.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.js
